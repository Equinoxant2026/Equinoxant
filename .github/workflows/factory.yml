name: Build Questions JSON (Merged Free + AI)

on:
  push:
    paths:
      - 'book.pdf'
      - 'pdf_to_factory.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install libraries
        run: pip install pymupdf openai
          
      - name: Run factory
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python pdf_to_factory.py
          
      - name: Upload questions.json as artifact (ALWAYS works)
        uses: actions/upload-artifact@v4
        with:
          name: questions-json
          path: assets/questions.json
          
      - name: Try to commit back to repo
        run: |
          git config user.name "factory-bot"
          git config user.email "bot@equinoxant.com"
          git add assets/questions.json || true
          git commit -m "Auto-build questions.json" || true
          git push || echo "Push failed but artifact saved - download it manually"
