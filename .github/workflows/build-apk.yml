name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew || chmod +x ./android/gradlew || true

      - name: Check questions.json exists
        run: ls -lh assets/questions.json || ls -lh app/src/main/assets/questions.json || echo "WARNING: questions.json not found!"

      - name: Build Debug APK
        run: ./gradlew assembleDebug || ./android/gradlew assembleDebug || ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Equinoxant-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
