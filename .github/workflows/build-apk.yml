name: Build Ziso Trivia APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          ls -la
          find. -name "gradlew" -type f
          chmod +x $(find. -name "gradlew" | head -1)
          $(find. -name "gradlew" | head -1) assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ziso-Trivia-APK
          path: "**/build/outputs/apk/debug/*.apk"
